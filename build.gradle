// The javac plugin rewrites javac's trees, so any JVM running it needs javac internals that jdk.compiler does not export.
ext.javacExports = ['api', 'code', 'tree', 'util'].collect {
    "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()
}

subprojects {
    apply plugin: 'java-library'

    group = 'cc.gahaha'
    // A release sets its version with -PreleaseVersion=... (see .github/workflows/release.yml).
    version = findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    // Besides Maven Local, every published module can go to build/repo: a Maven repository directory that a
    // release ships as a zip (publishAllPublicationsToReleaseRepository).
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'release'
                    url = rootProject.layout.buildDirectory.dir('repo')
                }
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
