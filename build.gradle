// The javac plugin rewrites javac's trees, so any JVM running it needs javac internals that jdk.compiler does not export.
ext.javacExports = ['api', 'code', 'tree', 'util'].collect {
    "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED".toString()
}

subprojects {
    apply plugin: 'java-library'

    group = 'cc.gahaha'
    // The version in gradle.properties, which semantic-release sets for each release (.releaserc). Only the
    // release build passes -Prelease; any other build is a snapshot of it.
    version = rootProject.version.toString() + (rootProject.hasProperty('release') ? '' : '-SNAPSHOT')

    repositories {
        mavenCentral()
    }

    // Besides Maven Local, every published module can go to build/repo: a Maven repository directory that a
    // release ships as a zip (publishAllPublicationsToReleaseRepository).
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'release'
                    url = rootProject.layout.buildDirectory.dir('repo')
                }
            }
            publications.withType(MavenPublication).configureEach {
                pom {
                    url = 'https://github.com/GahahaWang/FastMultiversion'
                    licenses {
                        license {
                            name = 'MPL-2.0'
                            url = 'https://www.mozilla.org/MPL/2.0/'
                        }
                    }
                    scm {
                        url = 'https://github.com/GahahaWang/FastMultiversion'
                    }
                }
            }
        }
    }

    // FastMultiversion is under the Mozilla Public License 2.0: every jar carries the license, and the POMs name it
    // and where the source is.
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
