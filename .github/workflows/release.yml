# semantic-release (.releaserc) on each push to master or dev: from the Conventional Commits since the last
# release (feat: → minor, fix:/perf: → patch, breaking change → major) it picks the next version, builds and
# tests it, commits the version and CHANGELOG.md, tags it and creates a GitHub release with the Gradle plugin
# (as a Maven repository zip) and the IntelliJ plugin. dev publishes pre-releases such as 0.2.0-dev.1; after a
# release on master, master is merged back into dev. Pushes without such commits release nothing.
name: Release

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
