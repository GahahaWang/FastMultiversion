# CI:
#
# build             Builds and tests every module, on each push and each pull request to dev. The IntelliJ
#                   plugin is built against IntelliJ IDEA downloaded from JetBrains and uploaded as an
#                   artifact. Tests that need Minecraft jars from a local Loom cache are skipped. For a push to
#                   dev, it also looks for a commit message that asks to merge into master ("merge to master" or
#                   "合併到 master", in any case).
#
# prerelease        After a push to dev that does not ask to merge (or a manual run on dev): semantic-release
#                   (release.config.cjs) publishes a pre-release of the next version, x.y.z-dev.n, if the
#                   Conventional Commits since the last release call for one (feat: → minor, fix:/perf: → patch,
#                   breaking change → major). It packs it (.github/scripts/package-release.sh), tags it and
#                   creates a GitHub pre-release with the Gradle plugin (as a Maven repository zip) and the
#                   IntelliJ plugin. Nothing is committed: gradle.properties keeps the last release's version.
#
# merge-to-master   After a push to dev that asks to merge: merges dev into master, then runs this workflow on
#                   master (a push with the workflow's own token would not start it).
#
# release           On master (the run started by merge-to-master, a push, or a manual run): semantic-release
#                   publishes the release x.y.z like a pre-release, but also commits the version and
#                   CHANGELOG.md to master; then merges master back into dev.
#
# pages             After a release or pre-release (or a manual run): writes the site from all releases
#                   (.github/scripts/pages.py) to the gh-pages branch, which GitHub Pages serves:
#                     maven/, updatePlugins.xml          releases
#                     maven-dev/, updatePlugins-dev.xml  releases, and the pre-releases newer than the last one
#                   Needs the repository setting Settings → Pages → Source: Deploy from a branch, gh-pages, / (root).
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      merge: ${{ steps.request.outputs.merge }}
    steps:
      - name: Look for a request to merge into master
        id: request
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          if jq -r '.commits[].message' "$GITHUB_EVENT_PATH" | grep -qiE 'merge[[:space:]]+(in)?to[[:space:]]+master|合併到[[:space:]]*master'; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit of this push asks to merge into master: a pre-release, if anything."
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build :intellij-plugin:buildPlugin

      - name: Upload the IntelliJ plugin
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  prerelease:
    needs: build
    if: >-
      github.ref == 'refs/heads/dev'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.build.outputs.merge != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - name: Pre-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-to-master:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.build.outputs.merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge dev into master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B master origin/master
          git merge --no-edit -m "Merge dev into master" "$GITHUB_SHA"
          git push -q origin master

      - name: Release from master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --ref master

  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - name: Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # dev gets the release commit, so that its next pre-releases count from this release.
      - name: Merge master back into dev
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin master dev
          git checkout -q -B dev origin/dev
          git merge --no-edit -m "Merge master back into dev" origin/master
          git push -q origin dev

  pages:
    needs: [prerelease, release]
    if: >-
      !cancelled() && !failure()
      && (needs.prerelease.outputs.published == 'true' || needs.release.outputs.published == 'true'
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
    steps:
      - uses: actions/checkout@v7

      - name: Write the Maven repositories and the IntelliJ plugin repositories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -s 'add' | python3 .github/scripts/pages.py intellij-plugin/build.gradle site

      - name: Publish it on the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version || needs.prerelease.outputs.version }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Plugin repositories${VERSION:+ for $VERSION}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" gh-pages
