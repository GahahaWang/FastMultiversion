# CI:
#
# build             Builds and tests every module, on each push and each pull request to dev. The IntelliJ
#                   plugin is built against IntelliJ IDEA downloaded from JetBrains and uploaded as an
#                   artifact. Tests that need Minecraft jars from a local Loom cache are skipped.
#
# release           After a push to dev builds: semantic-release (.releaserc). From the Conventional Commits since
#                   the last release (feat: → minor, fix:/perf: → patch, breaking change → major) it picks the
#                   next version (x.y.z), packs it (.github/scripts/package-release.sh), commits the version and
#                   CHANGELOG.md, tags it and creates a GitHub release with the Gradle plugin (as a Maven
#                   repository zip) and the IntelliJ plugin. Other commits release nothing.
#
# merge-to-master   After that, if a commit message of the push asks for it ("merge to master" or "合併到 master",
#                   in any case): merges dev, with the release, into master. master releases nothing itself.
#
# pages             After a release (or a manual run): writes the IntelliJ plugin repository,
#                   updatePlugins.xml, from the releases (.github/scripts/plugin-repository.py) to the gh-pages
#                   branch, which GitHub Pages serves. Needs the repository setting Settings → Pages → Source:
#                   Deploy from a branch, gh-pages, / (root).
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build :intellij-plugin:buildPlugin

      - name: Upload the IntelliJ plugin
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  release:
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
    outputs:
      published: ${{ steps.semantic-release.outputs.new_release_published }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
      tag: ${{ steps.semantic-release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - name: Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-to-master:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Look for a request to merge
        id: request
        run: |
          if jq -r '.commits[].message' "$GITHUB_EVENT_PATH" | grep -qiE 'merge[[:space:]]+(in)?to[[:space:]]+master|合併到[[:space:]]*master'; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit of this push asks to merge to master."
          fi

      - uses: actions/checkout@v7
        if: steps.request.outputs.merge == 'true'
        with:
          fetch-depth: 0

      - name: Merge dev into master
        if: steps.request.outputs.merge == 'true'
        env:
          # The release's commit (version and CHANGELOG.md), or the commit that was built if nothing was released.
          COMMIT: ${{ needs.release.outputs.tag || github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B master origin/master
          git merge --no-edit -m "Merge dev into master" "$COMMIT"
          git push -q origin master
          # A merge commit goes back to dev, if dev did not move on, so that the branches stay the same.
          git push -q origin master:dev || echo "dev moved on; master's merge commit stays on master."

  pages:
    needs: release
    if: needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
    steps:
      - uses: actions/checkout@v7

      - name: Write the IntelliJ plugin repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/$GH_REPO/releases?per_page=100" | python3 .github/scripts/plugin-repository.py intellij-plugin/build.gradle site

      - name: Publish it on the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Plugin repository${VERSION:+ for $VERSION}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" gh-pages
