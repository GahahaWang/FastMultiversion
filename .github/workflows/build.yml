# CI, in three jobs that run one after the other:
#
# build             Builds and tests every module, on each push and each pull request to dev. The IntelliJ
#                   plugin is built against IntelliJ IDEA downloaded from JetBrains and uploaded as an
#                   artifact. Tests that need Minecraft jars from a local Loom cache are skipped.
#
# release           After a push builds: semantic-release (.releaserc). From the Conventional Commits since the
#                   last release (feat: → minor, fix:/perf: → patch, breaking change → major) it picks the next
#                   version, packs it (.github/scripts/package-release.sh), commits the version and
#                   CHANGELOG.md, tags it and creates a GitHub release with the Gradle plugin (as a Maven
#                   repository zip) and the IntelliJ plugin. dev publishes pre-releases such as 0.2.0-dev.1;
#                   after a release on master, master is merged back into dev. Other commits release nothing.
#
# open-pull-request After a push to dev: opens a pull request from dev to master, unless one is open already or
#                   master has everything dev has. That needs the repository setting "Allow GitHub Actions to
#                   create and approve pull requests" (Settings → Actions → General → Workflow permissions).
name: CI

on:
  push:
    branches: [dev, master]
  # Pull requests to dev only: those to master are the one this workflow opens from dev, whose commits were
  # built when pushed to dev (GitHub does not run workflows for it, as the workflow's own token opened it).
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build :intellij-plugin:buildPlugin

      - name: Upload the IntelliJ plugin
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  open-pull-request:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open a pull request from dev to master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh pr list --head dev --base master --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "A pull request from dev to master is open already."
            exit 0
          fi
          ahead=$(gh api "repos/$GH_REPO/compare/master...dev" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "master has everything dev has."
            exit 0
          fi
          commits=$(gh api "repos/$GH_REPO/compare/master...dev" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')
          gh pr create --head dev --base master --title "Merge dev into master" \
            --body "$(printf 'Commits on dev that master does not have yet:\n\n%s\n' "$commits")"
