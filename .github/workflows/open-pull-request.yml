# Once the build of a push to dev passes, opens a pull request from dev to master, unless one is open
# already or master has everything dev has. Needs the repository setting "Allow GitHub Actions to create and
# approve pull requests" (Settings → Actions → General → Workflow permissions).
name: Open pull request

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request from dev to master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh pr list --head dev --base master --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "A pull request from dev to master is open already."
            exit 0
          fi
          ahead=$(gh api "repos/$GH_REPO/compare/master...dev" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "master has everything dev has."
            exit 0
          fi
          commits=$(gh api "repos/$GH_REPO/compare/master...dev" --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')
          gh pr create --head dev --base master --title "Merge dev into master" \
            --body "$(printf 'Commits on dev that master does not have yet:\n\n%s\n' "$commits")"
