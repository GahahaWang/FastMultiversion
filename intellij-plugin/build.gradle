import org.jetbrains.intellij.platform.gradle.TestFrameworkType

// The IntelliJ plugin: the range check as you type, quick fixes, code of inactive versions resolved
// against the version it runs in, and a New Project wizard for FastMultiversion mods (in Kotlin, for
// IntelliJ's UI DSL).
plugins {
    id 'org.jetbrains.intellij.platform' version '2.20.1'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

// Builds against an installed IntelliJ IDEA (-PideaPath=... or the default installation below) if there is
// one, otherwise (e.g. on CI) against the IntelliJ IDEA release ideaRelease, downloaded from JetBrains'
// repository: -PideaRelease=..., or the one in gradle/libs.versions.toml, which Dependabot keeps up to date.
def ideaPath = (findProperty('ideaPath') ?: 'C:/Program Files/JetBrains/IntelliJ IDEA 2026.3').toString()
def ideaRelease = (findProperty('ideaRelease') ?: libs.versions.intellij.idea.get()).toString()

configurations {
    // Libraries whose classes go into the plugin jar itself, so that the jar alone is a complete plugin:
    // installing build/libs/*.jar instead of the distribution zip must not lose them.
    bundled {
        canBeConsumed = false
        attributes { attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME)) }
    }
}

dependencies {
    compileOnly project(':apidb')
    compileOnly project(':versioning')
    bundled project(':apidb')
    bundled project(':versioning')
    testImplementation project(':apidb')
    testImplementation project(':versioning')
    testImplementation project(':apidb-generator')

    intellijPlatform {
        if (file(ideaPath).isDirectory()) {
            local(ideaPath)
        } else {
            intellijIdea(ideaRelease) {}
        }
        bundledPlugin('com.intellij.java')
        bundledPlugin('com.intellij.gradle')
        testFramework(TestFrameworkType.Platform.INSTANCE)
        testFramework(TestFrameworkType.Plugin.Java.INSTANCE)
    }

    // The fixture tests are JUnit 3 style.
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

intellijPlatform {
    buildSearchableOptions = false
    pluginConfiguration {
        id = 'cc.gahaha.fastmultiversion'
        name = 'FastMultiversion'
        version = project.version
        ideaVersion {
            sinceBuild = '263'
        }
    }
}

tasks.named('test', Test) {
    // The wizard test writes a sample project that uses this build of the Gradle plugin.
    systemProperty 'fastmultiversion.version', project.version.toString()
    systemProperty 'fastmultiversion.sample', layout.buildDirectory.dir('wizard-sample').get().asFile.path
}

tasks.named('processResources', ProcessResources) {
    // New projects from the wizard get this build's own Gradle wrapper.
    into('fastmultiversion/wrapper') {
        from(rootProject.files('gradlew', 'gradlew.bat'))
        from(rootProject.file('gradle/wrapper')) {
            into 'gradle/wrapper'
        }
    }
}

tasks.named('jar', Jar) {
    def bundledJars = configurations.bundled
    inputs.files(bundledJars).withPropertyName('bundledJars')
    from({ bundledJars.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}
